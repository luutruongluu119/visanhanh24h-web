name: Publish cam-nang article

on:
  schedule:
    # Tuesday and Friday, 03:07 UTC = 10:07 Vietnam time
    - cron: "7 3 * * 2,5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Release next queued article
        id: release
        run: python scripts/release_next_cam_nang.py | tee release_output.txt

      - name: Commit and push if a new article was released
        run: |
          if grep -q "^RELEASED:" release_output.txt; then
            git config user.name "cam-nang-bot"
            git config user.email "actions@users.noreply.github.com"
            git add -A -- ':!release_output.txt'
            git commit -m "Auto-publish: $(grep '^RELEASED:' release_output.txt | sed 's/^RELEASED: //')"
            git push
          else
            echo "Nothing to release this run."
          fi
          rm -f release_output.txt
